<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#84593d"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>إدارة كلمتين</title>
<link rel="icon" href="assets/favicon.jpg"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="manifest" href="admin.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="إدارة كلمتين">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--br:#84593d;--br2:#6b452c;--cr:#f8f2e8;--ln:#ece4d8;--ink:#2b221b;--mut:#7a6d60;--ok:#2e7d32;--warn:#b26a00;--bad:#b3261e;--r:16px}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Tajawal,system-ui,sans-serif;background:#fff;color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--cr);border-inline-end:1px solid var(--ln);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}.brand img{width:44px;height:44px;border-radius:50%}.brand b{display:block;font-size:17px;color:var(--br2)}.brand small{color:var(--mut);font-size:12px}
.nav button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:12px;font-weight:500;color:var(--ink);text-align:start}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:#fff8}.nav button.on{background:var(--br);color:#fff}
.side .out{margin-top:auto;border:1px solid var(--ln);background:#fff;border-radius:12px;padding:10px;color:var(--mut)}
main{padding:26px clamp(14px,3vw,36px) 90px;max-width:1180px;width:100%}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.stat{display:flex;gap:12px;align-items:center}.stat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--cr);color:var(--br);flex:none}.stat .ic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat b{display:block;font-size:22px;line-height:1.15;white-space:nowrap}.stat>div:last-child{min-width:0}.stat span{color:var(--mut);font-size:13px}
.btn{border:0;background:var(--br);color:#fff;border-radius:12px;padding:11px 18px;font-weight:700}.btn:hover{background:var(--br2)}.btn.s{background:#fff;color:var(--br);border:1px solid var(--br)}.btn.d{background:#fff;color:var(--bad);border:1px solid #e8b9b5}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.55;cursor:wait}
input,select,textarea{width:100%;border:1px solid #ddd2c2;border-radius:12px;padding:11px 13px;background:#fff;min-height:44px}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #84593d55;border-color:var(--br)}
label.f{display:block;margin:0 0 12px;font-size:13px;color:var(--mut)}label.f>input,label.f>select,label.f>textarea{margin-top:5px;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto;max-width:100%}h1,h2,h3,p,.sub,small{overflow-wrap:anywhere}.grow{flex:1 1 180px!important}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.list{display:flex;flex-direction:column}.li{display:grid;grid-template-columns:1.3fr 1.2fr 1fr .8fr .9fr;gap:10px;align-items:center;padding:13px 10px;border-bottom:1px solid var(--ln);cursor:pointer}.li:hover{background:var(--cr)}.li.h{cursor:default;color:var(--mut);font-size:12.5px;font-weight:700}.li.h:hover{background:none}
.li small{color:var(--mut);display:block}.empty{padding:34px;text-align:center;color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;border-bottom:1px solid var(--ln);padding-bottom:10px}.tabs button{border:0;background:none;padding:9px 15px;border-radius:99px;color:var(--mut);font-weight:500}.tabs button.on{background:var(--cr);color:var(--br2);font-weight:700}
.ov{position:fixed;inset:0;background:#0008;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:18px 10px}.ov>.card{max-width:760px;width:100%;margin:auto;padding:20px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 10px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
.tb{width:100%;border-collapse:collapse}.tb td,.tb th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:start;font-size:14px;vertical-align:top}.tb th{color:var(--mut);font-weight:500;font-size:12.5px}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:8px 14px}.steps button.on{color:#fff;border-color:transparent}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#2b221b;color:#fff;padding:11px 18px;border-radius:12px;z-index:90;max-width:92vw;box-shadow:0 8px 28px #0004}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.login{min-height:100vh;display:grid;place-items:center;background:var(--cr);padding:16px}.login .card{width:min(400px,100%);text-align:center;padding:28px}.login img{width:96px;height:96px;border-radius:50%}
.swatch{width:26px;height:26px;border-radius:50%;border:1px solid #0002;display:inline-block;vertical-align:middle}
.pc{display:flex;gap:12px;align-items:center}.pc img{width:76px;height:76px;object-fit:cover;border-radius:12px;background:var(--cr);flex:none}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.sw input{width:20px;height:20px;min-height:0;accent-color:var(--br)}
.stage{position:relative;direction:ltr;width:100%;max-width:460px;margin:auto;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--cr);touch-action:none}.stage img{display:block;width:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.rbox{position:absolute;border:2px dashed #b3261e;background:#b3261e1a;border-radius:6px;font-size:11px;color:#b3261e;overflow:hidden}.rbox.logo{border-color:#1a73e8;background:#1a73e81a;color:#1a73e8}.rbox.off{opacity:.45;border-style:dotted}.rbox.sel{border-style:solid;border-width:3px;cursor:move;z-index:3;overflow:visible}.rbox span{position:absolute;top:1px;inset-inline-start:4px;direction:rtl}
.hd{position:absolute;width:18px;height:18px;background:#fff;border:2px solid currentColor;border-radius:50%}.hd.w{right:-9px;top:calc(50% - 9px);cursor:ew-resize}.hd.h{bottom:-9px;left:calc(50% - 9px);cursor:ns-resize}.hd.wh{right:-9px;bottom:-9px;cursor:nwse-resize}
.dm{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:#2e7d32;border:2px solid #fff;box-shadow:0 0 0 1px #2e7d32}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.gi{border:1px solid var(--ln);border-radius:12px;padding:8px;background:#fff}.gi img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--cr);display:block}.gi input[type=text]{margin:6px 0;min-height:38px;padding:7px 9px;font-size:13px}
.bar{height:10px;background:var(--cr);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--br);width:0;transition:width .2s}
.note{background:var(--cr);border-radius:12px;padding:10px 14px;color:var(--mut);font-size:13.5px;margin:0 0 14px}.warn{background:#fff4e0;color:#8a5a00}.hide{display:none!important}
.col{min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px clamp(14px,3vw,36px);background:#fffffff2;border-bottom:1px solid var(--ln)}
.top .btn{text-decoration:none;display:inline-block}
.btn.wa{background:#1f9d55;color:#fff}.btn.wa:hover{background:#17803f}.btn.s.wa{background:#1f9d55;color:#fff;border:0}
a.btn{display:inline-block;text-align:center}
.stat.click{cursor:pointer;transition:box-shadow .15s,border-color .15s}.stat.click:hover,.stat.click:focus-visible{border-color:var(--br);box-shadow:0 2px 12px #84593d26;outline:none}
.tabs.chips{margin-bottom:12px}.tabs.chips button{border:1px solid var(--ln);background:#fff}.tabs.chips button.on{background:var(--br);color:#fff;border-color:var(--br)}
.card.inset{background:var(--cr);border-color:var(--ln)}
.cname{font-size:19px;font-weight:700}.cphone{font-size:17px;font-weight:700;color:var(--br2);margin-top:2px;unicode-bidi:plaintext;text-align:start}
.pt{width:100%;border-collapse:collapse}.pt td,.pt th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:start;font-size:14px}.pt th{color:var(--mut);font-weight:500;font-size:12.5px}
.tw{overflow-x:auto}.tw .tb{min-width:420px}
.bn{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{display:none}main{padding:14px 14px 100px}.top{padding:8px 14px}.ov{padding:8px 6px}.ov>.card{padding:14px}.row .btn.wa,.row .btn.sm{flex:1 1 auto}.tabs.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px}.tabs.chips button{white-space:nowrap;flex:none}
.bn{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
.bn button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:5px 0;min-height:48px}.bn button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bn button.on{color:var(--br)}
.li{grid-template-columns:1fr auto;gap:2px 10px}.li.h{display:none}.li>*:nth-child(3),.li>*:nth-child(4){display:none}
.kv{grid-template-columns:90px 1fr}.toast{bottom:90px}}
</style></head><body>
<div id="root"></div>
<script src="cups-data.js"></script><script src="config.js"></script><script src="admin.js"></script>
</body></html>
